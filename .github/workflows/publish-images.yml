name: Publish application images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: identity-lifecycle-bridge
            context: services/identity-lifecycle-bridge
          - name: email-sink
            context: services/email-sink
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/kanutocd/spherical-mammoth-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/kanutocd/spherical-mammoth-${{ matrix.name }}:latest
