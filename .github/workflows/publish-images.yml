name: Publish application images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish (for example, v1.5.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
    strategy:
      matrix:
        include:
          - name: identity-lifecycle-bridge
            context: services/identity-lifecycle-bridge
          - name: email-sink
            context: services/email-sink
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Validate image tag
        shell: bash
        run: test "${IMAGE_TAG}" != "" && [[ "${IMAGE_TAG}" == v* ]]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/kanutocd/spherical-mammoth-${{ matrix.name }}:${{ env.IMAGE_TAG }}
            ghcr.io/kanutocd/spherical-mammoth-${{ matrix.name }}:latest
