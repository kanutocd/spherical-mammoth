# yaml-language-server: $schema=https://raw.githubusercontent.com/kanutocd/mammoth/v1.5.3/config/mammoth.schema.json

mammoth:
  name: spherical_mammoth_local

node:
  node_id: spherical-mammoth-compose
  node_name: spherical-mammoth-local
  environment: development
  labels:
    deployment: compose
  metadata:
    owner: data-plane

postgres:
  host: postgres
  port: 5432
  database: spherical_mammoth
  username: mammoth
  password_env: MAMMOTH_POSTGRES_PASSWORD

replication:
  slot: spherical_mammoth
  publications:
    - spherical_mammoth_publication
  auto_create_slot: true
  temporary_slot: false
  feedback_interval: 2.0

delivery:
  unit: event
  ordering:
    scope: global

runtime:
  adapter: concurrent
  concurrency: 1
  batch_size: 1
  preserve_order: true
  timeout_seconds: 15

destinations:
  - name: transactional_email
    type: webhook
    enabled: true
    url: http://email-sink:8080/v1/deliveries
    timeout_seconds: 10
    route:
      schemas:
        - public
      tables:
        - domain_events
      operations:
        - insert
    signing:
      algorithm: hmac_sha256
      secret_env: MAMMOTH_WEBHOOK_SIGNING_SECRET
      signature_header: X-Mammoth-Signature
      timestamp_header: X-Mammoth-Timestamp
    retry:
      max_attempts: 8
      schedule_seconds:
        - 1
        - 2
        - 5
        - 10
        - 30

retry:
  max_attempts: 5
  schedule_seconds:
    - 1
    - 5
    - 30

sqlite:
  path: /app/.sqlite3/mammoth.db

operational_state:
  adapter: sqlite

logging:
  level: info
