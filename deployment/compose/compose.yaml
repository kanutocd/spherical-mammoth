name: spherical-mammoth

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: spherical_mammoth
      POSTGRES_USER: spherical_mammoth
      POSTGRES_PASSWORD: spherical_mammoth
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../platform/postgres/init.sql:/docker-entrypoint-initdb.d/001-spherical-mammoth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spherical_mammoth -d spherical_mammoth"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
    networks: [application]

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    command: migrate sql -e --yes --config /etc/config/kratos/kratos.yml
    volumes:
      - ../../platform/kratos:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks: [data]

  kratos:
    image: oryd/kratos:v1.3.1
    command: serve --config /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ../../platform/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "4433:4433"
      - "4434:4434"
    networks: [identity, data, application]

  mammoth-init:
    image: ghcr.io/kanutocd/mammoth:v1.5.1
    environment:
      MAMMOTH_POSTGRES_PASSWORD: ${MAMMOTH_POSTGRES_PASSWORD:-development-only}
      MAMMOTH_WEBHOOK_SIGNING_SECRET: ${MAMMOTH_WEBHOOK_SIGNING_SECRET:-development-only-signing-secret}
    command: ["sh", "-c", "mammoth validate /config/mammoth.yml && mammoth bootstrap /config/mammoth.yml"]
    volumes:
      - ../../platform/mammoth/mammoth.yml:/config/mammoth.yml:ro
      - mammoth-data:/app/.sqlite3
    depends_on:
      postgres:
        condition: service_healthy
      email-sink:
        condition: service_healthy
    restart: "no"
    networks: [data, application]

  mammoth:
    image: ghcr.io/kanutocd/mammoth:v1.5.1
    environment:
      MAMMOTH_POSTGRES_PASSWORD: ${MAMMOTH_POSTGRES_PASSWORD:-development-only}
      MAMMOTH_WEBHOOK_SIGNING_SECRET: ${MAMMOTH_WEBHOOK_SIGNING_SECRET:-development-only-signing-secret}
    command: ["start", "/config/mammoth.yml"]
    volumes:
      - ../../platform/mammoth/mammoth.yml:/config/mammoth.yml:ro
      - mammoth-data:/app/.sqlite3
    depends_on:
      mammoth-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mammoth", "status", "/config/mammoth.yml"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data, application]

  identity-lifecycle-bridge:
    build: ../../services/identity-lifecycle-bridge
    environment:
      DATABASE_URL: postgres://spherical_mammoth:spherical_mammoth@postgres:5432/spherical_mammoth
      CORS_ALLOWED_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks: [identity, data, application]

  email-sink:
    build: ../../services/email-sink
    environment:
      EMAIL_SINK_DB_PATH: /data/email-sink.db
      EMAIL_FROM_ADDRESS: no-reply@spherical-mammoth.test
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      DELIVERY_SECRET: ${MAMMOTH_WEBHOOK_SIGNING_SECRET:-development-only-signing-secret}
    volumes:
      - email-sink-data:/data
    depends_on:
      - mailpit
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [application]

  web:
    build:
      context: ../../apps/web
      args:
        VITE_KRATOS_PUBLIC_URL: http://localhost:4433
        VITE_BRIDGE_URL: http://localhost:8081
    ports:
      - "${WEB_PORT:-3000}:80"
    networks: [edge, application, identity]

volumes:
  postgres-data:
  mammoth-data:
  mailpit-data:
  email-sink-data:

networks:
  edge:
  application:
  identity:
  data:
  observability:
