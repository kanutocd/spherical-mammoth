name: spherical-mammoth

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: spherical_mammoth
      POSTGRES_USER: spherical_mammoth
      POSTGRES_PASSWORD: spherical_mammoth
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../platform/postgres/init.sql:/docker-entrypoint-initdb.d/001-spherical-mammoth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spherical_mammoth -d spherical_mammoth"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
    networks: [application]

  kratos:
    image: oryd/kratos:v1.3.1
    command: serve --config /etc/config/kratos/kratos.yml --dev
    volumes:
      - ../../platform/kratos:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4433:4433"
      - "4434:4434"
    networks: [identity, data]

  mammoth:
    image: ghcr.io/kanutocd/mammoth:latest
    profiles: [implemented]
    command: ["start", "/etc/mammoth/mammoth.yml"]
    volumes:
      - ../../platform/mammoth:/etc/mammoth:ro
      - mammoth-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, application]

  identity-lifecycle-bridge:
    build: ../../services/identity-lifecycle-bridge
    environment:
      DATABASE_URL: postgres://spherical_mammoth:spherical_mammoth@postgres:5432/spherical_mammoth
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks: [identity, data, application]

  email-sink:
    build: ../../services/email-sink
    environment:
      EMAIL_SINK_DB_PATH: /data/email-sink.db
      EMAIL_FROM_ADDRESS: no-reply@spherical-mammoth.test
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
    volumes:
      - email-sink-data:/data
    depends_on:
      - mailpit
    ports:
      - "8082:8080"
    networks: [application]

  web:
    build:
      context: ../../apps/web
      args:
        VITE_KRATOS_PUBLIC_URL: http://localhost:4433
        VITE_BRIDGE_URL: http://localhost:8081
    ports:
      - "3000:80"
    networks: [edge, application, identity]

volumes:
  postgres-data:
  mammoth-data:
  mailpit-data:
  email-sink-data:

networks:
  edge:
  application:
  identity:
  data:
  observability:
