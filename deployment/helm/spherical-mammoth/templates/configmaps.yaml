apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spherical-mammoth.fullname" . }}-postgres-init
  labels:
    {{- include "spherical-mammoth.labels" . | nindent 4 }}
data:
  001-spherical-mammoth.sql: |
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mammoth') THEN
        CREATE ROLE mammoth WITH LOGIN REPLICATION PASSWORD '{{ .Values.secrets.mammothPostgresPassword }}';
      END IF;
    END
    $$;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE TABLE IF NOT EXISTS signup_requests (
      id uuid PRIMARY KEY,
      identity_id text NOT NULL UNIQUE,
      email text NOT NULL,
      display_name text,
      status text NOT NULL CHECK (status IN ('verification_requested', 'completed')),
      created_at timestamptz NOT NULL DEFAULT now(),
      completed_at timestamptz
    );
    CREATE TABLE IF NOT EXISTS accounts (
      id uuid PRIMARY KEY,
      identity_id text NOT NULL UNIQUE,
      email text NOT NULL,
      display_name text,
      created_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS domain_events (
      event_id uuid PRIMARY KEY,
      event_type text NOT NULL,
      aggregate_id uuid NOT NULL,
      occurred_at timestamptz NOT NULL DEFAULT now(),
      data jsonb NOT NULL,
      CHECK (jsonb_typeof(data) = 'object')
    );
    GRANT SELECT ON TABLE domain_events TO mammoth;
    CREATE PUBLICATION spherical_mammoth_publication FOR TABLE domain_events;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spherical-mammoth.fullname" . }}-kratos
  labels:
    {{- include "spherical-mammoth.labels" . | nindent 4 }}
data:
  kratos.yml: |
    version: v1.3.0
    dsn: postgres://spherical_mammoth:{{ .Values.secrets.postgresPassword }}@{{ include "spherical-mammoth.fullname" . }}-postgres:5432/spherical_mammoth?sslmode=disable
    serve:
      public:
        base_url: {{ .Values.kratos.publicUrl }}/
        cors:
          enabled: true
          allow_credentials: true
          allowed_origins:
            - {{ .Values.kratos.browserUrl }}
          allowed_methods: [GET, POST, PUT, PATCH, DELETE]
          allowed_headers: [Content-Type, Accept]
      admin:
        base_url: http://{{ include "spherical-mammoth.fullname" . }}-kratos:4434/
    selfservice:
      default_browser_return_url: {{ .Values.kratos.browserUrl }}/
      allowed_return_urls:
        - {{ .Values.kratos.browserUrl }}
      methods:
        password:
          enabled: true
      flows:
        registration:
          enabled: true
          enable_legacy_one_step: true
          ui_url: {{ .Values.kratos.browserUrl }}/registration
        verification:
          enabled: true
          use: code
          ui_url: {{ .Values.kratos.browserUrl }}/verification
        recovery:
          enabled: true
          use: code
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/kratos/identity.schema.json
    courier:
      smtp:
        connection_uri: smtp://{{ include "spherical-mammoth.fullname" . }}-mailpit:1025/?disable_starttls=true
  identity.schema.json: |
    {
      "$id": "https://spherical-mammoth.local/identity.schema.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Spherical Mammoth Identity",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "ory.sh/kratos": {
                "credentials": { "password": { "identifier": true } },
                "verification": { "via": "email" },
                "recovery": { "via": "email" }
              }
            },
            "display_name": { "type": "string", "minLength": 1, "maxLength": 120 }
          },
          "required": ["email", "display_name"],
          "additionalProperties": false
        }
      }
    }
