{{- if .Values.mailpit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spherical-mammoth.fullname" . }}-mailpit
  labels:
    {{- include "spherical-mammoth.componentLabels" (dict "root" . "component" "mailpit") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spherical-mammoth.fullname" . }}-mailpit
  labels:
    {{- include "spherical-mammoth.componentLabels" (dict "root" . "component" "mailpit") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mailpit
    spec:
      containers:
        - name: mailpit
          image: "{{ .Values.mailpit.image.repository }}:{{ .Values.mailpit.image.tag }}"
          imagePullPolicy: {{ .Values.mailpit.image.pullPolicy }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.mailpit.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "spherical-mammoth.fullname" . }}-mailpit
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.mailpit.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "spherical-mammoth.fullname" . }}-mailpit
  labels:
    {{- include "spherical-mammoth.componentLabels" (dict "root" . "component" "mailpit") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.mailpit.persistence.size }}
{{- end }}
{{- end }}
